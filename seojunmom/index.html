<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서준엄마네</title>
<script>
  // 인쇄된 전단지 QR코드가 이 옛 주소를 가리킵니다. 새 주소로 자동 이동합니다.
  // 주소 뒤에 붙은 경로와 ?check 같은 값도 그대로 넘깁니다.
  (function () {
    var NEW = 'https://cybertrade91.github.io/seojunmom/';
    var m = location.pathname.match(/^\/seojunmom\/?(.*)$/);
    location.replace(NEW + (m ? m[1] : '') + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://cybertrade91.github.io/seojunmom/">
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;text-align:center;padding:48px 16px;color:#232323}a{color:#FF850D;font-weight:700}</style>
</head>
<body>
<p>서준엄마네 페이지로 이동하고 있어요.</p>
<p><a href="https://cybertrade91.github.io/seojunmom/">바로 이동하기</a></p>
</body>
</html>
